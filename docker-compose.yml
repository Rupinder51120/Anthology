services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://anthology:anthology@db:5432/anthology
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      - OLLAMA_URL=http://ollama:11434
      - COHERE_API_KEY=${COHERE_API_KEY}
    volumes:
      - ./indexes:/app/indexes
      - ./data:/app/data
      - ./src:/app/src
      - ./api:/app/api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: anthology
      POSTGRES_PASSWORD: anthology
      POSTGRES_DB: anthology
    ports:
      - "5432:5432"
    volumes:
      - anthology_pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anthology"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  anthology_pgdata:
    external: true
  ollama_data: