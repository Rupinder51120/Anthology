services:
  - type: web
    name: anthology-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anthology-db
          property: connectionString
      - key: USE_GROQ
        value: "true"
      - key: USE_PGVECTOR
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHONPATH
        value: "."
      - key: GROQ_MODEL
        value: "llama-3.1-8b-instant"

databases:
  - name: anthology-db
    plan: free
    databaseName: anthology
    user: anthology
