[project]
name = "anthology"
version = "1.0.0"
description = "AI research assistant: hybrid dense+sparse RAG (pgvector + Postgres FTS + Cohere rerank) over a self-ingested paper corpus, with a FastAPI backend and React frontend."
readme = "README.md"
requires-python = ">=3.11"
# This list reflects the packages actually imported by api/, src/, and
# scripts/ (verified via AST import-scan), plus the runtime tooling needed
# to serve/migrate/test the app. It is NOT the pinned, canonical dependency
# set for the running container -- requirements.txt (installed directly by
# the Dockerfile) is. Keep this list accurate to the import graph rather
# than trying to mirror requirements.txt's full pinned/transitive closure.
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "asyncpg",
    "psycopg2-binary",
    "alembic",
    "pgvector",
    "redis",
    "numpy",
    "docling",
    "sentence-transformers",
    "transformers",
    "langchain-text-splitters",
    "groq",
    "cohere",
    "langfuse",
    "arxiv",
    "requests",
    "httpx",
    "python-dotenv",
    "Pillow",
]

[tool.pytest.ini_options]
# These are ad hoc debug scripts from a specific ingestion-crash investigation
# (see docs/ANTHOLOGY_FULL_AUDIT.md, BUG-27), not real tests: no test_*
# functions, no asserts, and they execute real Docling PDF-conversion
# pipeline code (heavy model loading, local-file dependent) at import time.
# A bare `pytest` / `pytest tests/` must not collect them.
addopts = [
    "--ignore=tests/test_docling.py",
    "--ignore=tests/test_page1_no_ocr.py",
    "--ignore=tests/test_page1_single_thread_ocr.py",
    "--ignore=tests/split_pdf.py",
]
